<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/panels.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <a class="skip" href="#composer-input">Skip to message box</a>
  <div id="app">
    <aside id="rail" aria-label="Conversations">
      <div class="brand">
        <canvas id="orb" width="96" height="96" aria-hidden="true"></canvas>
        <div>
          <div class="brand-name">JARVIS</div>
          <div class="brand-state" id="orb-state">idle</div>
        </div>
      </div>
      <button id="new-chat" class="primary wide" type="button"><span class="btn-icon" data-icon="plus" data-size="16"></span>New chat <kbd>Ctrl+N</kbd></button>
      <div class="search-wrap">
        <span class="search-icon" data-icon="search" data-size="15"></span>
        <input id="session-search" type="search" placeholder="Search chats" aria-label="Search conversations (Ctrl+K)">
      </div>
      <ul id="sessions" class="sessions"></ul>
    </aside>

    <main id="center">
      <header id="topbar">
        <button id="toggle-rail" class="icon-btn narrow-only" type="button" aria-label="Show conversations" aria-expanded="false" data-icon="menu" data-size="18"></button>
        <h1 id="title" title="Conversation title">New conversation</h1>
        <div class="spacer"></div>
        <div class="popover-wrap">
          <button id="character-btn" class="pill" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Switch character"></button>
          <div id="character-menu" class="menu popover" role="listbox" hidden></div>
        </div>
        <div class="popover-wrap">
          <button id="model-pill" class="pill model-pill" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Switch model or provider">
            <span class="pill-dot" aria-hidden="true"></span><span id="model-label" class="pill-text"></span><span data-icon="down" data-size="13"></span>
          </button>
          <div id="model-menu" class="menu popover model-menu" role="dialog" aria-label="Switch model or provider" hidden></div>
        </div>
        <button id="autospeak" class="icon-btn" type="button" aria-pressed="false" aria-label="Auto-speak is off. Click to turn on" title="Auto-speak: off" data-icon="speaker-off" data-size="17"></button>
        <span id="busy" class="busy idle" role="status" aria-live="polite"><span class="dot"></span><span id="busy-text">idle</span></span>
        <button id="toggle-drawer" class="icon-btn" type="button" aria-label="Toggle side panel" aria-expanded="true" title="Side panel" data-icon="panel" data-size="18"></button>
      </header>
      <div id="banner" class="banner" role="alert" hidden></div>
      <div id="stage">
        <div id="transcript" role="log" aria-label="Conversation" aria-live="polite" tabindex="0"></div>
        <button id="jump" class="jump" type="button" hidden aria-label="Jump to latest message"><span data-icon="arrow-down" data-size="15"></span>Jump to latest</button>
      </div>
      <form id="composer" autocomplete="off">
        <div id="suggest" class="suggest" role="listbox" hidden></div>
        <div class="composer-box">
          <textarea id="composer-input" rows="1" placeholder="Message Jarvis…" aria-label="Message (Enter to send, Shift+Enter for a new line, / for commands)"></textarea>
          <div class="composer-actions">
            <button type="button" id="mic" class="icon-btn" aria-label="Hold to talk" title="Hold to talk" data-icon="mic" data-size="18"></button>
            <button type="button" id="stop" class="round danger" hidden aria-label="Stop (Esc)" title="Stop (Esc)" data-icon="stop" data-size="16"></button>
            <button type="submit" id="send" class="round primary" aria-label="Send" title="Send (Enter)" data-icon="send" data-size="18"></button>
          </div>
        </div>
        <p class="composer-hint">Enter to send &middot; Shift+Enter for a new line &middot; / for commands</p>
      </form>
    </main>

    <aside id="drawer" aria-label="Side panels"></aside>
  </div>
  <div id="scrim" class="scrim"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
