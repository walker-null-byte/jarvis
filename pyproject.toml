[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-harness"
version = "1.1.2"
description = "A local-first, self-improving AI agent with a web UI: any model provider, memory, tools, MCP, agents, routines and group discussions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "walker-null-byte"}
]
keywords = ["ai", "agent", "terminal", "local-ai", "openai-compatible", "hermes-alternative", "voice", "tts", "stt", "memory", "mcp", "lm-studio", "ollama", "llama.cpp", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core agent + providers
    "openai>=1.0.0",
    "anthropic>=2.0.0",
    "mcp>=1.0",
    "httpx>=0.27.0",
    "turbomcp>=0.2.0",
    "numpy>=1.26.0",
    "tomli>=2.0; python_version < '3.11'",
    # Interfaces: terminal UI + web UI
    "textual>=0.50.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    # Web tools (search / scrape)
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=0.3.0",
    "googlesearch-python>=1.2.0",
    # Semantic tool search + memory
    "model2vec>=0.1.0",
    # Voice: Piper TTS + faster-whisper STT. Voice *models* are not bundled;
    # they download on demand from the UI. Kokoro (kokoro-onnx) is an optional
    # one-click install from the UI as well.
    "piper-tts>=1.2.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/walker-null-byte/jarvis"
Source = "https://github.com/walker-null-byte/jarvis"
Changelog = "https://github.com/walker-null-byte/jarvis#changelog"

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-supervisor = "jarvis.supervisor:main"
jarvis-codify = "jarvis.codify:main"
jarvis-consolidate = "jarvis.consolidate:main"
jarvis-mcp = "jarvis.mcp_server:main"
jarvis-run-job = "jarvis.run_job:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.toml"]
"jarvis.webui" = ["static/*", "static/**/*"]
"jarvis" = ["characters_builtin/*.json", "agents_builtin/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "__pycache__/*", "*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
