# Jarvis configuration — copy to config.toml and edit
# 
# Any setting can also be overridden by environment variables with prefix JARVIS_
# e.g., JARVIS_LLM_BASE_URL=http://localhost:11434/v1

[llm]
# Any OpenAI-compatible endpoint works:
#   LM Studio:    http://localhost:1234/v1
#   Ollama:       http://localhost:11434/v1
#   llama.cpp:    http://localhost:8080/v1
#   Gemini:       https://generativelanguage.googleapis.com/v1beta/openai/
# Hosted presets (switch at runtime with /provider use <name>):
#   openai, gemini, openrouter, groq, deepseek, mistral, xai, vllm
#   cloudflare, cloudflare-gateway — set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#                (optional CLOUDFLARE_GATEWAY_ID, default "default")
#   chatgpt   — "Sign in with ChatGPT": uses your Plus/Pro plan (run /login chatgpt)
#   anthropic — native Claude API via the official SDK (pip install 'jarvis[anthropic]')
base_url = "http://localhost:1234/v1"
provider = "custom"  # custom, lmstudio, ollama, llama.cpp, openai, or gemini
model = "gemma-4"  # or whatever model your server serves
# Name of the environment variable holding the API key (local servers ignore it)
# For Gemini: set api_key_env = "GEMINI_API_KEY" and export the key
api_key_env = "JARVIS_API_KEY"
stream = true
max_tokens = 4096
timeout = 120
retries = 2
retry_delay = 1.0
# Reasoning effort for backends that support it (anthropic: low|medium|high|xhigh|max).
# Leave empty for the backend default.
effort = ""

[agent]
# Max tool-call rounds per user message before Jarvis is told to wrap up
max_tool_rounds = 50
# Summarize older conversation once the in-context transcript exceeds this many chars (~6k tokens)
history_char_limit = 24000
keep_recent = 8
# TurboMCP tool exposure:
#   "search" — send only core_tools plus find_tools/call_tool/read_skill; the model
#              discovers everything else on demand (small, cache-stable context)
#   "all"    — send every tool schema on every request (for models that can't
#              handle tool search)
tool_mode = "search"
core_tools = ["run_command", "read_file", "write_file", "list_dir", "remember", "recall"]
# Default character card for new sessions: jarvis, casual, robotic, or an imported card id
character = "jarvis"
# Max characters of MEMORY.md placed in the system prompt (the rest stays reachable via recall)
memory_index_chars = 4000

[paths]
# Where Jarvis stores its mind (episodes, facts, skills, personality)
mind = "mind"
# Where downloaded voice models are stored
models = "models"

[voice]
enabled = false
# enabled = true speaks every reply aloud (off by default; toggle in the web UI header).
# Voice runs locally and works with every LLM provider.
engine = "piper"  # "piper" (default) or "kokoro" (optional one-click install, kokoro-onnx)
# Piper voice. Models are not bundled: download from the web UI Voice tab or
# `/voice download piper:en_US-lessac-medium`.
model = "en_US-lessac-medium"
kokoro_voice = "af_sky"

# STT settings
stt_model = "small"  # faster-whisper size: tiny, base, small (download via /voice download whisper:<size>)
stt_device = "auto"  # "auto", "cpu", "cuda"
stt_compute_type = "int8"  # faster-whisper compute type
audio_device = ""  # optional sounddevice output device name/index

[security]
# "guarded" blocks destructive shell patterns and limits file tools to these roots.
# Use "permissive" only on a trusted machine where the agent is fully trusted.
mode = "guarded"
allowed_roots = ["."]
allow_outside_roots = false
max_command_timeout = 300
approval_timeout = 120

[jobs]
# "private-file" records requested jobs without modifying the system crontab.
# Use "system" to install entries in the current user's crontab when available.
# Status reports distinguish recorded-only, installed, and unavailable states.
backend = "private-file"
crontab_file = "~/.jarvis_crontab"

[webui]
# `jarvis --web` serves the browser UI. Keep it on loopback: the agent can run commands.
host = "127.0.0.1"
port = 7777
open_browser = true
